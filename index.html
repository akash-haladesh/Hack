<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Anti-Gravity Interactive Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(255, 255, 255, 0.035);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-hover-border: rgba(99, 179, 237, 0.4);
      --accent-cyan: #38ef7d;
      --accent-blue: #00d2ff;
      --accent-purple: #9d4edd;
      --accent-pink: #ff5376;
      --text-main: #f0f4fc;
      --text-muted: #8a99ad;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #111827 0%, #080b12 55%, #040508 100%);
      color: var(--text-main);
      font-family: var(--font-sans);
      position: relative;
    }

    /* Ambient Background Glow & Starfield */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Cursor Ripple Canvas */
    #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Floating Playground Container */
    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 2;
      pointer-events: none; /* children enable pointer events */
    }

    /* Floating Element Base */
    .float-item {
      position: absolute;
      pointer-events: auto;
      cursor: grab;
      will-change: transform;
      transform-origin: center center;
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
      touch-action: none;
    }

    .float-item:active {
      cursor: grabbing;
    }

    /* Modern Glassmorphism Cards */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 24px;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.45),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .card:hover {
      border-color: var(--card-hover-border);
      box-shadow: 0 20px 45px -5px rgba(0, 210, 255, 0.2),
                  inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #38ef7d;
    }
    .badge-live::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #38ef7d;
      border-radius: 50%;
      box-shadow: 0 0 8px #38ef7d;
      animation: pulse 2s infinite;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-body {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .metric-value {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin: 8px 0 2px;
      background: linear-gradient(135deg, #ffffff 40%, #00d2ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Floating Bubbles / Spheres */
    .bubble {
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.1) 25%, rgba(0, 210, 255, 0.15) 50%, rgba(157, 78, 221, 0.2) 80%, rgba(0, 0, 0, 0.4) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35),
                  inset -6px -6px 14px rgba(0, 0, 0, 0.45),
                  inset 5px 5px 12px rgba(255, 255, 255, 0.5),
                  0 0 20px rgba(0, 210, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .bubble::after {
      content: '';
      position: absolute;
      top: 15%;
      left: 20%;
      width: 25%;
      height: 15%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      transform: rotate(-35deg);
      filter: blur(1.5px);
    }

    .bubble-content {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.05em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    /* Ambient UI Header & Bottom Bar */
    .hud-header {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 10;
      pointer-events: auto;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #00d2ff, #9d4edd);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      font-family: var(--font-mono);
    }

    .controls-panel {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 30, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .btn {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      padding: 8px 16px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      border-radius: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .btn-active {
      background: rgba(0, 210, 255, 0.15) !important;
      border: 1px solid rgba(0, 210, 255, 0.4) !important;
      color: #00d2ff !important;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.25);
    }

    .hud-stats {
      position: fixed;
      top: 24px;
      right: 28px;
      background: rgba(15, 20, 30, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      z-index: 10;
      display: flex;
      gap: 16px;
      pointer-events: none;
    }

    .hud-hint {
      position: fixed;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
      pointer-events: none;
      animation: floatHint 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    @keyframes floatHint {
      0%, 100% { transform: translate(-50%, 0); opacity: 0.4; }
      50% { transform: translate(-50%, -4px); opacity: 0.8; }
    }

    @media (max-width: 640px) {
      .hud-header { top: 16px; left: 16px; }
      .hud-stats { display: none; }
      .controls-panel { bottom: 16px; width: 92%; justify-content: space-around; padding: 4px 6px; }
      .btn { padding: 6px 10px; font-size: 12px; }
      .card { padding: 16px 18px; }
    }
  </style>
</head>
<body>

  <!-- Starfield & Background Nebula Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Interactive Shockwave & Force Ripple Canvas -->
  <canvas id="fx-canvas"></canvas>

  <!-- HUD Brand -->
  <div class="hud-header">
    <div class="brand-title">
      <div class="brand-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
      <span>ANTIGRAVITY</span>
    </div>
    <div class="brand-subtitle">MICROGRAVITY LAB // 0.00G</div>
  </div>

  <!-- HUD Telemetry Stats -->
  <div class="hud-stats">
    <div>FPS: <span id="stat-fps" style="color: #38ef7d;">60</span></div>
    <div>OBJECTS: <span id="stat-count" style="color: #00d2ff;">0</span></div>
    <div>FIELD: <span id="stat-mode" style="color: #ff5376;">REPEL</span></div>
  </div>

  <!-- Hint -->
  <div class="hud-hint">✦ Move cursor to deflect • Click for Anti-G shockwave • Drag & toss objects</div>

  <!-- Interactive Floating Elements Stage -->
  <div id="stage"></div>

  <!-- Control HUD -->
  <div class="controls-panel">
    <button class="btn btn-active" id="btn-mode">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 8v8M8 12h8"></path>
      </svg>
      <span id="btn-mode-text">Repulsion</span>
    </button>
    <button class="btn" id="btn-shockwave">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
      </svg>
      <span>Shockwave</span>
    </button>
    <button class="btn" id="btn-add">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 8v8M8 12h8"></path>
      </svg>
      <span>Spawn</span>
    </button>
    <button class="btn" id="btn-reset">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
      </svg>
      <span>Reset</span>
    </button>
  </div>

  <script>
    /* =========================================================================
       ANTIGRAVITY PHYSICS & INTERACTION ENGINE
       ========================================================================= */

    // Canvas & Stage references
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    const stage = document.getElementById('stage');

    // Telemetry displays
    const statFps = document.getElementById('stat-fps');
    const statCount = document.getElementById('stat-count');
    const statMode = document.getElementById('stat-mode');
    const btnMode = document.getElementById('btn-mode');
    const btnModeText = document.getElementById('btn-mode-text');
    const btnShockwave = document.getElementById('btn-shockwave');
    const btnAdd = document.getElementById('btn-add');
    const btnReset = document.getElementById('btn-reset');

    let width = window.innerWidth;
    let height = window.innerHeight;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      bgCanvas.width = width;
      bgCanvas.height = height;
      fxCanvas.width = width;
      fxCanvas.height = height;
      initStars();
    }
    window.addEventListener('resize', resize);

    // Interaction State
    const mouse = {
      x: -1000,
      y: -1000,
      prevX: -1000,
      prevY: -1000,
      vx: 0,
      vy: 0,
      active: false,
      down: false,
      mode: 'repel' // 'repel' or 'attract'
    };

    // Shockwaves
    const shockwaves = [];

    // Background Stars / Space Dust
    let stars = [];
    function initStars() {
      stars = [];
      const count = Math.floor((width * height) / 9000);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.3,
          alpha: Math.random() * 0.7 + 0.2,
          speedX: (Math.random() - 0.5) * 0.15,
          speedY: (Math.random() - 0.5) * 0.15,
          pulse: Math.random() * Math.PI * 2
        });
      }
    }

    // Floating Items collection
    const items = [];
    let draggedItem = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    class FloatEntity {
      constructor(element, type = 'card') {
        this.el = element;
        this.type = type;
        
        // Physical bounds
        const rect = element.getBoundingClientRect();
        this.w = rect.width || 120;
        this.h = rect.height || 120;
        this.radius = Math.max(this.w, this.h) / 2;
        this.mass = type === 'bubble' ? 0.8 : 2.0;

        // Position & Inertia
        this.x = Math.random() * (width - this.w - 100) + 50;
        this.y = Math.random() * (height - this.h - 150) + 60;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;

        // Rotation
        this.rotation = (Math.random() - 0.5) * 12;
        this.vRot = (Math.random() - 0.5) * 0.08;

        // Zero-G ambient harmonic drift
        this.seedX = Math.random() * 1000;
        this.seedY = Math.random() * 1000;
        this.harmonicSpeed = 0.0012 + Math.random() * 0.001;

        this.isHovered = false;
        this.isDragged = false;

        this.bindEvents();
      }

      bindEvents() {
        this.el.addEventListener('pointerdown', (e) => {
          draggedItem = this;
          this.isDragged = true;
          dragOffsetX = (this.x + this.w / 2) - e.clientX;
          dragOffsetY = (this.y + this.h / 2) - e.clientY;
          this.vx = 0;
          this.vy = 0;
          this.el.setPointerCapture(e.pointerId);
          e.stopPropagation();
        });

        this.el.addEventListener('pointerup', (e) => {
          if (draggedItem === this) {
            draggedItem = null;
            this.isDragged = false;
            // Throw with inertia from mouse velocity
            this.vx = mouse.vx * 0.65;
            this.vy = mouse.vy * 0.65;
            this.vRot += (Math.random() - 0.5) * 2;
          }
        });

        this.el.addEventListener('pointercancel', () => {
          if (draggedItem === this) {
            draggedItem = null;
            this.isDragged = false;
          }
        });

        this.el.addEventListener('mouseenter', () => { this.isHovered = true; });
        this.el.addEventListener('mouseleave', () => { this.isHovered = false; });
      }

      update(time) {
        if (this.isDragged) {
          const targetX = mouse.x + dragOffsetX - this.w / 2;
          const targetY = mouse.y + dragOffsetY - this.h / 2;
          this.vx = (targetX - this.x) * 0.35;
          this.vy = (targetY - this.y) * 0.35;
          this.x += this.vx;
          this.y += this.vy;
          this.rotation += this.vx * 0.1;
          this.render();
          return;
        }

        // 1. Ambient Zero-Gravity Brownian Drift (sinusoidal waves)
        const driftForceX = Math.sin(time * this.harmonicSpeed + this.seedX) * 0.035;
        const driftForceY = Math.cos(time * this.harmonicSpeed + this.seedY) * 0.035;
        this.vx += driftForceX;
        this.vy += driftForceY;

        // 2. Mouse Anti-Gravity Interaction (Repulsion or Attraction)
        if (mouse.active) {
          const cx = this.x + this.w / 2;
          const cy = this.y + this.h / 2;
          const dx = cx - mouse.x;
          const dy = cy - mouse.y;
          const distSq = dx * dx + dy * dy;
          const dist = Math.sqrt(distSq);
          const influenceRadius = 240 + this.radius;

          if (dist < influenceRadius && dist > 1) {
            const factor = (1 - dist / influenceRadius);
            const force = (factor * factor * 1.8) / this.mass;
            const nx = dx / dist;
            const ny = dy / dist;

            if (mouse.mode === 'repel') {
              this.vx += nx * force * 1.2;
              this.vy += ny * force * 1.2;
              // Add dynamic momentum from moving mouse
              this.vx += mouse.vx * 0.08 * factor;
              this.vy += mouse.vy * 0.08 * factor;
              this.vRot += (nx * mouse.vy - ny * mouse.vx) * 0.02;
            } else {
              // Attract
              this.vx -= nx * force * 0.9;
              this.vy -= ny * force * 0.9;
            }
          }
        }

        // 3. Shockwave Impulse Forces
        for (let i = 0; i < shockwaves.length; i++) {
          const sw = shockwaves[i];
          const cx = this.x + this.w / 2;
          const cy = this.y + this.h / 2;
          const dx = cx - sw.x;
          const dy = cy - sw.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          // If the shockwave wavefront hits this element
          const waveDist = Math.abs(dist - sw.radius);
          if (waveDist < 50 && dist > 2) {
            const impulse = ((50 - waveDist) / 50) * (sw.strength / this.mass) * 0.9;
            this.vx += (dx / dist) * impulse;
            this.vy += (dy / dist) * impulse;
            this.vRot += (Math.random() - 0.5) * impulse * 0.8;
          }
        }

        // 4. Vacuum Micro-Damping (keeps motion smooth & perpetual)
        this.vx *= 0.985;
        this.vy *= 0.985;
        this.vRot *= 0.96;

        // Speed Cap
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        const maxSpeed = 16;
        if (speed > maxSpeed) {
          this.vx = (this.vx / speed) * maxSpeed;
          this.vy = (this.vy / speed) * maxSpeed;
        }

        // Position integration
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.vRot;

        // 5. Soft Screen Edge Bounce (with restitution)
        const bounce = 0.72;
        const margin = 10;

        if (this.x < margin) {
          this.x = margin;
          this.vx = Math.abs(this.vx) * bounce;
          this.vRot += (Math.random() - 0.5) * 0.2;
        } else if (this.x + this.w > width - margin) {
          this.x = width - margin - this.w;
          this.vx = -Math.abs(this.vx) * bounce;
          this.vRot += (Math.random() - 0.5) * 0.2;
        }

        if (this.y < margin) {
          this.y = margin;
          this.vy = Math.abs(this.vy) * bounce;
          this.vRot += (Math.random() - 0.5) * 0.2;
        } else if (this.y + this.h > height - margin) {
          this.y = height - margin - this.h;
          this.vy = -Math.abs(this.vy) * bounce;
          this.vRot += (Math.random() - 0.5) * 0.2;
        }

        this.render();
      }

      render() {
        const tiltX = -this.vy * 0.8;
        const tiltY = this.vx * 0.8;
        this.el.style.transform = `translate3d(${this.x.toFixed(2)}px, ${this.y.toFixed(2)}px, 0) rotate(${this.rotation.toFixed(2)}deg) skewX(${tiltX.toFixed(1)}deg) skewY(${tiltY.toFixed(1)}deg)`;
      }
    }

    /* =========================================================================
       ELEMENT FACTORY (CARDS & BUBBLES)
       ========================================================================= */

    const CARD_TEMPLATES = [
      {
        tag: 'Telemetry',
        title: 'Zero-G Core',
        badge: 'LIVE',
        body: 'Local curvature neutralized. Inertial damping active.',
        metric: '0.000 g'
      },
      {
        tag: 'Specimen A-17',
        title: 'Orbital Velocity',
        badge: 'ORBIT',
        body: 'Drifting smoothly across frictionless space-time.',
        metric: '7.66 km/s'
      },
      {
        tag: 'Atmosphere',
        title: 'Micro-Vacuum',
        badge: 'STABLE',
        body: 'Kinetic transfer coefficient minimized.',
        metric: '10⁻⁸ Torr'
      },
      {
        tag: 'Philosophy',
        title: 'Gravitas Null',
        badge: 'FREE',
        body: '"Gravity is merely the geometry of unburdened matter."',
        metric: 'Δv = 0'
      }
    ];

    const BUBBLE_LABELS = [
      'ψ-field', 'Quantum', 'Null-G', 'Hover', 'Levitate', 'Cosmos', 'Photon', 'Orbit', 'Drift'
    ];

    function createCardElement(data) {
      const card = document.createElement('div');
      card.className = 'float-item card';
      card.style.width = '240px';
      card.innerHTML = `
        <div class="card-header">
          <span class="card-tag">${data.tag}</span>
          <span class="card-tag badge-live">${data.badge}</span>
        </div>
        <div class="card-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2">
            <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14"/>
          </svg>
          ${data.title}
        </div>
        <div class="metric-value">${data.metric}</div>
        <div class="card-body">${data.body}</div>
      `;
      stage.appendChild(card);
      return new FloatEntity(card, 'card');
    }

    function createBubbleElement(label, size = 90) {
      const bubble = document.createElement('div');
      bubble.className = 'float-item bubble';
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;

      // Gradient accent variant
      const hue = Math.floor(Math.random() * 80 + 170); // Cyan to Purple
      bubble.style.borderColor = `hsla(${hue}, 80%, 75%, 0.35)`;
      bubble.style.boxShadow = `0 10px 30px rgba(0, 0, 0, 0.4), 0 0 24px hsla(${hue}, 80%, 60%, 0.25)`;

      bubble.innerHTML = `<span class="bubble-content">${label}</span>`;
      stage.appendChild(bubble);
      return new FloatEntity(bubble, 'bubble');
    }

    function seedInitialEntities() {
      // Clear existing
      stage.innerHTML = '';
      items.length = 0;

      // Add modern glass cards
      CARD_TEMPLATES.forEach(tmpl => {
        items.push(createCardElement(tmpl));
      });

      // Add floating bubbles
      const bubbleSizes = [110, 85, 95, 75, 120, 70, 90];
      bubbleSizes.forEach((size, idx) => {
        const label = BUBBLE_LABELS[idx % BUBBLE_LABELS.length];
        items.push(createBubbleElement(label, size));
      });

      statCount.textContent = items.length;
    }

    function spawnRandomEntity() {
      if (Math.random() > 0.5) {
        const tmpl = CARD_TEMPLATES[Math.floor(Math.random() * CARD_TEMPLATES.length)];
        const entity = createCardElement(tmpl);
        entity.x = mouse.active ? mouse.x - entity.w / 2 : width / 2 - entity.w / 2;
        entity.y = mouse.active ? mouse.y - entity.h / 2 : height / 2 - entity.h / 2;
        entity.vx = (Math.random() - 0.5) * 4;
        entity.vy = (Math.random() - 0.5) * 4;
        items.push(entity);
      } else {
        const label = BUBBLE_LABELS[Math.floor(Math.random() * BUBBLE_LABELS.length)];
        const size = Math.floor(Math.random() * 50 + 65);
        const entity = createBubbleElement(label, size);
        entity.x = mouse.active ? mouse.x - size / 2 : width / 2 - size / 2;
        entity.y = mouse.active ? mouse.y - size / 2 : height / 2 - size / 2;
        entity.vx = (Math.random() - 0.5) * 5;
        entity.vy = (Math.random() - 0.5) * 5;
        items.push(entity);
      }
      triggerShockwave(
        mouse.active ? mouse.x : width / 2,
        mouse.active ? mouse.y : height / 2,
        6
      );
      statCount.textContent = items.length;
    }

    /* =========================================================================
       SHOCKWAVE & RIPPLE FX
       ========================================================================= */

    function triggerShockwave(x, y, strength = 10) {
      shockwaves.push({
        x: x,
        y: y,
        radius: 10,
        maxRadius: Math.max(width, height) * 0.45,
        speed: 14,
        strength: strength,
        alpha: 1.0
      });
    }

    // Trigger shockwave on background click
    window.addEventListener('pointerdown', (e) => {
      // If clicking inside interactive controls, ignore
      if (e.target.closest('.controls-panel') || e.target.closest('.float-item')) return;
      triggerShockwave(e.clientX, e.clientY, 12);
    });

    // Spacebar triggers shockwave from center or cursor
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        triggerShockwave(
          mouse.active ? mouse.x : width / 2,
          mouse.active ? mouse.y : height / 2,
          14
        );
      }
    });

    /* =========================================================================
       MOUSE & TOUCH TRACKING WITH VELOCITY INERTIA
       ========================================================================= */

    function updatePointer(x, y) {
      if (mouse.prevX === -1000) {
        mouse.prevX = x;
        mouse.prevY = y;
      }
      mouse.vx = x - mouse.prevX;
      mouse.vy = y - mouse.prevY;
      mouse.prevX = x;
      mouse.prevY = y;
      mouse.x = x;
      mouse.y = y;
      mouse.active = true;
    }

    window.addEventListener('pointermove', (e) => {
      updatePointer(e.clientX, e.clientY);
    });

    window.addEventListener('pointerleave', () => {
      mouse.active = false;
      mouse.vx = 0;
      mouse.vy = 0;
      mouse.prevX = -1000;
      mouse.prevY = -1000;
    });

    // Touch support
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        updatePointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    /* =========================================================================
       CONTROLS
       ========================================================================= */

    btnMode.addEventListener('click', () => {
      if (mouse.mode === 'repel') {
        mouse.mode = 'attract';
        btnModeText.textContent = 'Attraction';
        statMode.textContent = 'ATTRACT';
        statMode.style.color = '#38ef7d';
        btnMode.classList.add('btn-active');
      } else {
        mouse.mode = 'repel';
        btnModeText.textContent = 'Repulsion';
        statMode.textContent = 'REPEL';
        statMode.style.color = '#ff5376';
        btnMode.classList.remove('btn-active');
      }
    });

    btnShockwave.addEventListener('click', (e) => {
      triggerShockwave(width / 2, height / 2, 16);
    });

    btnAdd.addEventListener('click', () => {
      spawnRandomEntity();
    });

    btnReset.addEventListener('click', () => {
      seedInitialEntities();
      triggerShockwave(width / 2, height / 2, 10);
    });

    /* =========================================================================
       RENDER & ANIMATION LOOP
       ========================================================================= */

    let lastTime = performance.now();
    let frameCount = 0;
    let lastFpsUpdate = performance.now();

    function animate(currentTime) {
      requestAnimationFrame(animate);

      // FPS Calculation
      frameCount++;
      if (currentTime - lastFpsUpdate >= 500) {
        const fps = Math.round((frameCount * 1000) / (currentTime - lastFpsUpdate));
        statFps.textContent = fps;
        frameCount = 0;
        lastFpsUpdate = currentTime;
      }

      // Smooth mouse inertia decay when cursor stops
      mouse.vx *= 0.85;
      mouse.vy *= 0.85;

      // 1. Render Ambient Background Canvas
      bgCtx.clearRect(0, 0, width, height);

      // Dynamic cursor aura / gravitational well glow
      if (mouse.active) {
        const auraGrad = bgCtx.createRadialGradient(
          mouse.x, mouse.y, 0,
          mouse.x, mouse.y, 220
        );
        if (mouse.mode === 'repel') {
          auraGrad.addColorStop(0, 'rgba(0, 210, 255, 0.12)');
          auraGrad.addColorStop(0.5, 'rgba(157, 78, 221, 0.05)');
          auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else {
          auraGrad.addColorStop(0, 'rgba(56, 239, 125, 0.14)');
          auraGrad.addColorStop(0.5, 'rgba(0, 210, 255, 0.06)');
          auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        }
        bgCtx.fillStyle = auraGrad;
        bgCtx.beginPath();
        bgCtx.arc(mouse.x, mouse.y, 220, 0, Math.PI * 2);
        bgCtx.fill();
      }

      // Draw drifting space dust & stars
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.x += s.speedX;
        s.y += s.speedY;
        s.pulse += 0.02;

        if (s.x < 0) s.x = width;
        if (s.x > width) s.x = 0;
        if (s.y < 0) s.y = height;
        if (s.y > height) s.y = 0;

        const currentAlpha = s.alpha * (0.6 + 0.4 * Math.sin(s.pulse));
        bgCtx.fillStyle = `rgba(255, 255, 255, ${currentAlpha.toFixed(2)})`;
        bgCtx.beginPath();
        bgCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        bgCtx.fill();
      }

      // 2. Render Shockwave FX Canvas
      fxCtx.clearRect(0, 0, width, height);
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += sw.speed;
        sw.alpha = Math.max(0, 1 - sw.radius / sw.maxRadius);

        if (sw.alpha <= 0.01) {
          shockwaves.splice(i, 1);
          continue;
        }

        // Ripple Ring 1 (Electric Blue)
        fxCtx.beginPath();
        fxCtx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        fxCtx.strokeStyle = `rgba(0, 210, 255, ${(sw.alpha * 0.7).toFixed(2)})`;
        fxCtx.lineWidth = 3 * sw.alpha;
        fxCtx.shadowColor = '#00d2ff';
        fxCtx.shadowBlur = 15;
        fxCtx.stroke();

        // Ripple Ring 2 (Purple secondary echo)
        if (sw.radius > 25) {
          fxCtx.beginPath();
          fxCtx.arc(sw.x, sw.y, sw.radius - 20, 0, Math.PI * 2);
          fxCtx.strokeStyle = `rgba(157, 78, 221, ${(sw.alpha * 0.4).toFixed(2)})`;
          fxCtx.lineWidth = 1.5 * sw.alpha;
          fxCtx.shadowColor = '#9d4edd';
          fxCtx.shadowBlur = 10;
          fxCtx.stroke();
        }
        fxCtx.shadowBlur = 0; // reset
      }

      // 3. Update & Physics for all Floating Entities
      for (let i = 0; i < items.length; i++) {
        items[i].update(currentTime);
      }
    }

    // Initialize
    resize();
    seedInitialEntities();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
